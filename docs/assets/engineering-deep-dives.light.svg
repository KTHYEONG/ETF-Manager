<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" role="img" style="font-family:Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
  <title>ETF-Manager 3대 핵심 문제 해결 사례</title>
  <desc>미래 데이터 누출 차단, 100년 가상 데이터 착시 차단과 실제 ETF 거부권, ISA 3년 만기 해지 통념 검증</desc>
  <defs><filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.07" data-paint-static="true"/></filter></defs>
  <rect width="1200" height="850" fill="#F7F7F5" data-fill-role="canvas"/>
  <rect x="48" y="44" width="6" height="64" rx="3" fill="#2E6DA4" data-fill-role="focus"/>
  <text x="70" y="50" font-size="13.5" font-weight="700" fill="#2F3846" data-fill-role="ink" text-anchor="start" dominant-baseline="central" letter-spacing="0.08em">ENGINEERING DEEP DIVES</text>
  <text x="70" y="78" font-size="28" font-weight="700" fill="#1B212B" data-fill-role="ink" text-anchor="start" dominant-baseline="central">데이터 왜곡과 투자 통념을 깬 3대 핵심 문제 해결 사례</text>
  <text x="70" y="108" font-size="15" font-weight="600" fill="#2F3846" data-fill-role="ink" text-anchor="start" dominant-baseline="central">착시를 탐지하고, 공학적 원리와 가드로 해결하여 코드와 아티팩트로 증명된 수치</text>
  <rect x="48" y="140" width="1104" height="210" rx="16" fill="#FFFFFF" data-fill-role="surface" stroke="#2E6DA4" stroke-width="1.5" data-stroke-role="edge-line" filter="url(#shadow)"/>
  <rect x="72" y="158" width="160" height="28" rx="14" fill="#EAF0F6" stroke="#2E6DA4" stroke-width="1" data-fill-role="blue-fill" data-stroke-role="blue-line"/>
  <text x="152.0" y="172.0" font-size="12.5" font-weight="700" fill="#12324E" data-fill-role="blue-ink" text-anchor="middle" dominant-baseline="central" letter-spacing="0.04em">CASE 01 · 문제 상황</text>
  <text x="72" y="206" font-size="20" font-weight="700" fill="#12324E" data-fill-role="blue-ink" text-anchor="start" dominant-baseline="central">미래 데이터 누출(Look-Ahead)</text>
  <text x="72" y="238" font-size="14.5" font-weight="600" fill="#1B212B" data-fill-role="ink" text-anchor="start" dominant-baseline="central">물가 지표(CPI) 발표 시차(6~8주)를</text>
  <text x="72" y="260" font-size="14.5" font-weight="600" fill="#1B212B" data-fill-role="ink" text-anchor="start" dominant-baseline="central">무시하거나, 장 마감 종가를 확인한</text>
  <text x="72" y="282" font-size="14.5" font-weight="600" fill="#1B212B" data-fill-role="ink" text-anchor="start" dominant-baseline="central">당일 즉시 그 종가로 매수 가정하여</text>
  <text x="72" y="304" font-size="14.5" font-weight="600" fill="#1B212B" data-fill-role="ink" text-anchor="start" dominant-baseline="central">백테스트 수익률이 현실보다 부풀려지는</text>
  <text x="72" y="326" font-size="14.5" font-weight="600" fill="#1B212B" data-fill-role="ink" text-anchor="start" dominant-baseline="central">심각한 정보 왜곡이 있었습니다.</text>
  <rect x="376" y="164" width="170" height="162" rx="12" fill="#EAF0F6" data-fill-role="blue-fill" stroke="#2E6DA4" stroke-width="1.2" data-stroke-role="edge-line"/>
  <text x="390" y="190" font-size="16.5" font-weight="700" fill="#12324E" data-fill-role="blue-ink" text-anchor="start" dominant-baseline="central">① 탐지</text>
  <text x="390" y="228" font-size="15" font-weight="600" fill="#12324E" data-fill-role="blue-ink" text-anchor="start" dominant-baseline="central">실제 공개 시각 태깅</text>
  <text x="390" y="254" font-size="15" font-weight="600" fill="#12324E" data-fill-role="blue-ink" text-anchor="start" dominant-baseline="central">미래 데이터 유입 시</text>
  <text x="390" y="280" font-size="15" font-weight="600" fill="#12324E" data-fill-role="blue-ink" text-anchor="start" dominant-baseline="central">즉시 예외 발생 중단</text>
  <path d="M552.0 237.0 L560.0 245.0 L552.0 253.0" fill="none" stroke="#2E6DA4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="blue-line"/>
  <rect x="566" y="164" width="170" height="162" rx="12" fill="#EAF0F6" data-fill-role="blue-fill" stroke="#2E6DA4" stroke-width="1.2" data-stroke-role="edge-line"/>
  <text x="580" y="190" font-size="16.5" font-weight="700" fill="#12324E" data-fill-role="blue-ink" text-anchor="start" dominant-baseline="central">② 조치</text>
  <text x="580" y="228" font-size="15" font-weight="600" fill="#12324E" data-fill-role="blue-ink" text-anchor="start" dominant-baseline="central">다음 날(T+1) 체결</text>
  <text x="580" y="254" font-size="15" font-weight="600" fill="#12324E" data-fill-role="blue-ink" text-anchor="start" dominant-baseline="central">정수 주수 매수 전용</text>
  <text x="580" y="280" font-size="15" font-weight="600" fill="#12324E" data-fill-role="blue-ink" text-anchor="start" dominant-baseline="central">연말 공제 이익실현</text>
  <path d="M742.0 237.0 L750.0 245.0 L742.0 253.0" fill="none" stroke="#2E6DA4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="blue-line"/>
  <rect x="756" y="164" width="170" height="162" rx="12" fill="#EAF0F6" data-fill-role="blue-fill" stroke="#2E6DA4" stroke-width="1.2" data-stroke-role="edge-line"/>
  <text x="770" y="190" font-size="16.5" font-weight="700" fill="#12324E" data-fill-role="blue-ink" text-anchor="start" dominant-baseline="central">③ 무결성 검증</text>
  <text x="770" y="228" font-size="15" font-weight="600" fill="#12324E" data-fill-role="blue-ink" text-anchor="start" dominant-baseline="central">SHA-256 저장소</text>
  <text x="770" y="254" font-size="15" font-weight="600" fill="#12324E" data-fill-role="blue-ink" text-anchor="start" dominant-baseline="central">1바이트 변조 거부</text>
  <text x="770" y="280" font-size="15" font-weight="600" fill="#12324E" data-fill-role="blue-ink" text-anchor="start" dominant-baseline="central">현금 보존 검증</text>
  <rect x="950" y="164" width="178" height="70" rx="12" fill="#EAF0F6" data-fill-role="blue-fill" stroke="#2E6DA4" stroke-width="1.2" data-stroke-role="edge-line"/>
  <text x="1039.0" y="188" font-size="27" font-weight="700" fill="#12324E" data-fill-role="blue-ink" text-anchor="middle" dominant-baseline="central">0건</text>
  <text x="1039.0" y="218" font-size="14.5" font-weight="600" fill="#12324E" data-fill-role="blue-ink" text-anchor="middle" dominant-baseline="central">미래 데이터 참조 누출</text>
  <rect x="950" y="246" width="178" height="70" rx="12" fill="#EAF0F6" data-fill-role="blue-fill" stroke="#2E6DA4" stroke-width="1.2" data-stroke-role="edge-line"/>
  <text x="1039.0" y="270" font-size="27" font-weight="700" fill="#12324E" data-fill-role="blue-ink" text-anchor="middle" dominant-baseline="central">1 Byte</text>
  <text x="1039.0" y="300" font-size="14.5" font-weight="600" fill="#12324E" data-fill-role="blue-ink" text-anchor="middle" dominant-baseline="central">데이터 변조 즉시 감지</text>
  <rect x="48" y="372" width="1104" height="210" rx="16" fill="#FFFFFF" data-fill-role="surface" stroke="#3F8F72" stroke-width="1.5" data-stroke-role="edge-line" filter="url(#shadow)"/>
  <rect x="72" y="390" width="160" height="28" rx="14" fill="#ECF4F1" stroke="#3F8F72" stroke-width="1" data-fill-role="green-fill" data-stroke-role="green-line"/>
  <text x="152.0" y="404.0" font-size="12.5" font-weight="700" fill="#17402F" data-fill-role="green-ink" text-anchor="middle" dominant-baseline="central" letter-spacing="0.04em">CASE 02 · 문제 상황</text>
  <text x="72" y="438" font-size="20" font-weight="700" fill="#17402F" data-fill-role="green-ink" text-anchor="start" dominant-baseline="central">100년 가상 데이터 착시</text>
  <text x="72" y="468" font-size="14.5" font-weight="600" fill="#1B212B" data-fill-role="ink" text-anchor="start" dominant-baseline="central">국내 ETF 역사가 짧아 100년 가상</text>
  <text x="72" y="489" font-size="14.5" font-weight="600" fill="#1B212B" data-fill-role="ink" text-anchor="start" dominant-baseline="central">지수로 연금 후보를 평가했더니,</text>
  <text x="72" y="510" font-size="14.5" font-weight="600" fill="#1B212B" data-fill-role="ink" text-anchor="start" dominant-baseline="central">가상 지수에선 1위였던 배당 20%가</text>
  <text x="72" y="531" font-size="14.5" font-weight="600" fill="#1B212B" data-fill-role="ink" text-anchor="start" dominant-baseline="central">최근 10년 실제 ETF 구간에서는</text>
  <text x="72" y="552" font-size="14.5" font-weight="600" fill="#1B212B" data-fill-role="ink" text-anchor="start" dominant-baseline="central">오히려 손실을 내는 착시가 발생했습니다.</text>
  <rect x="376" y="396" width="170" height="162" rx="12" fill="#ECF4F1" data-fill-role="green-fill" stroke="#3F8F72" stroke-width="1.2" data-stroke-role="edge-line"/>
  <text x="390" y="422" font-size="16.5" font-weight="700" fill="#17402F" data-fill-role="green-ink" text-anchor="start" dominant-baseline="central">① 탐지</text>
  <text x="390" y="460" font-size="15" font-weight="600" fill="#17402F" data-fill-role="green-ink" text-anchor="start" dominant-baseline="central">100년·현대·실제</text>
  <text x="390" y="486" font-size="15" font-weight="600" fill="#17402F" data-fill-role="green-ink" text-anchor="start" dominant-baseline="central">3개 구간 물리 분리</text>
  <text x="390" y="512" font-size="15" font-weight="600" fill="#17402F" data-fill-role="green-ink" text-anchor="start" dominant-baseline="central">구간별 최악값 산출</text>
  <path d="M552.0 469.0 L560.0 477.0 L552.0 485.0" fill="none" stroke="#3F8F72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="green-line"/>
  <rect x="566" y="396" width="170" height="162" rx="12" fill="#ECF4F1" data-fill-role="green-fill" stroke="#3F8F72" stroke-width="1.2" data-stroke-role="edge-line"/>
  <text x="580" y="422" font-size="16.5" font-weight="700" fill="#17402F" data-fill-role="green-ink" text-anchor="start" dominant-baseline="central">② 조치</text>
  <text x="580" y="460" font-size="15" font-weight="600" fill="#17402F" data-fill-role="green-ink" text-anchor="start" dominant-baseline="central">최저 점수 기준 평가</text>
  <text x="580" y="486" font-size="15" font-weight="600" fill="#17402F" data-fill-role="green-ink" text-anchor="start" dominant-baseline="central">0.995 지배 가드 및</text>
  <text x="580" y="512" font-size="15" font-weight="600" fill="#17402F" data-fill-role="green-ink" text-anchor="start" dominant-baseline="central">실제 ETF 거부권</text>
  <path d="M742.0 469.0 L750.0 477.0 L742.0 485.0" fill="none" stroke="#3F8F72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="green-line"/>
  <rect x="756" y="396" width="170" height="162" rx="12" fill="#ECF4F1" data-fill-role="green-fill" stroke="#3F8F72" stroke-width="1.2" data-stroke-role="edge-line"/>
  <text x="770" y="422" font-size="16.5" font-weight="700" fill="#17402F" data-fill-role="green-ink" text-anchor="start" dominant-baseline="central">③ 무결성 검증</text>
  <text x="770" y="460" font-size="15" font-weight="600" fill="#17402F" data-fill-role="green-ink" text-anchor="start" dominant-baseline="central">2,000회 부트스트랩</text>
  <text x="770" y="486" font-size="15" font-weight="600" fill="#17402F" data-fill-role="green-ink" text-anchor="start" dominant-baseline="central">세후 원장 순위와</text>
  <text x="770" y="512" font-size="15" font-weight="600" fill="#17402F" data-fill-role="green-ink" text-anchor="start" dominant-baseline="central">교차 대사 후 동결</text>
  <rect x="950" y="396" width="178" height="70" rx="12" fill="#ECF4F1" data-fill-role="green-fill" stroke="#3F8F72" stroke-width="1.2" data-stroke-role="edge-line"/>
  <text x="1039.0" y="420" font-size="27" font-weight="700" fill="#17402F" data-fill-role="green-ink" text-anchor="middle" dominant-baseline="central">1.024배</text>
  <text x="1039.0" y="450" font-size="14.5" font-weight="600" fill="#17402F" data-fill-role="green-ink" text-anchor="middle" dominant-baseline="central">3대 구간 최저 우위</text>
  <rect x="950" y="478" width="178" height="70" rx="12" fill="#ECF4F1" data-fill-role="green-fill" stroke="#3F8F72" stroke-width="1.2" data-stroke-role="edge-line"/>
  <text x="1039.0" y="502" font-size="27" font-weight="700" fill="#17402F" data-fill-role="green-ink" text-anchor="middle" dominant-baseline="central">0.995</text>
  <text x="1039.0" y="532" font-size="14.5" font-weight="600" fill="#17402F" data-fill-role="green-ink" text-anchor="middle" dominant-baseline="central">전 구간 지배 가드 통과</text>
  <rect x="48" y="604" width="1104" height="210" rx="16" fill="#FFFFFF" data-fill-role="surface" stroke="#B08434" stroke-width="1.5" data-stroke-role="edge-line" filter="url(#shadow)"/>
  <rect x="72" y="622" width="160" height="28" rx="14" fill="#FBF3E3" stroke="#B08434" stroke-width="1" data-fill-role="amber-fill" data-stroke-role="amber-line"/>
  <text x="152.0" y="636.0" font-size="12.5" font-weight="700" fill="#503606" data-fill-role="amber-ink" text-anchor="middle" dominant-baseline="central" letter-spacing="0.04em">CASE 03 · 문제 상황</text>
  <text x="72" y="670" font-size="20" font-weight="700" fill="#503606" data-fill-role="amber-ink" text-anchor="start" dominant-baseline="central">ISA 3년 만기 해지 통념</text>
  <text x="72" y="700" font-size="14.5" font-weight="600" fill="#1B212B" data-fill-role="ink" text-anchor="start" dominant-baseline="central">"3년마다 해지해 연금으로 이전하라"는</text>
  <text x="72" y="721" font-size="14.5" font-weight="600" fill="#1B212B" data-fill-role="ink" text-anchor="start" dominant-baseline="central">인터넷 통념과 미시행 세제안 소문이</text>
  <text x="72" y="742" font-size="14.5" font-weight="600" fill="#1B212B" data-fill-role="ink" text-anchor="start" dominant-baseline="central">퍼져 있으나, 해지 분리과세(9.9%)로 인한</text>
  <text x="72" y="763" font-size="14.5" font-weight="600" fill="#1B212B" data-fill-role="ink" text-anchor="start" dominant-baseline="central">원금 손실과 복리 단절을 정밀하게</text>
  <text x="72" y="784" font-size="14.5" font-weight="600" fill="#1B212B" data-fill-role="ink" text-anchor="start" dominant-baseline="central">검증한 원장이 없었습니다.</text>
  <rect x="376" y="628" width="170" height="162" rx="12" fill="#FBF3E3" data-fill-role="amber-fill" stroke="#B08434" stroke-width="1.2" data-stroke-role="edge-line"/>
  <text x="390" y="654" font-size="16.5" font-weight="700" fill="#503606" data-fill-role="amber-ink" text-anchor="start" dominant-baseline="central">① 탐지</text>
  <text x="390" y="692" font-size="15" font-weight="600" fill="#503606" data-fill-role="amber-ink" text-anchor="start" dominant-baseline="central">국회 계류안 배제</text>
  <text x="390" y="718" font-size="15" font-weight="600" fill="#503606" data-fill-role="amber-ink" text-anchor="start" dominant-baseline="central">시행 법령 조문 반영</text>
  <text x="390" y="744" font-size="15" font-weight="600" fill="#503606" data-fill-role="amber-ink" text-anchor="start" dominant-baseline="central">세율 하드코딩 0건</text>
  <path d="M552.0 701.0 L560.0 709.0 L552.0 717.0" fill="none" stroke="#B08434" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="amber-line"/>
  <rect x="566" y="628" width="170" height="162" rx="12" fill="#FBF3E3" data-fill-role="amber-fill" stroke="#B08434" stroke-width="1.2" data-stroke-role="edge-line"/>
  <text x="580" y="654" font-size="16.5" font-weight="700" fill="#503606" data-fill-role="amber-ink" text-anchor="start" dominant-baseline="central">② 조치</text>
  <text x="580" y="692" font-size="15" font-weight="600" fill="#503606" data-fill-role="amber-ink" text-anchor="start" dominant-baseline="central">외부 납입금 고정</text>
  <text x="580" y="718" font-size="15" font-weight="600" fill="#503606" data-fill-role="amber-ink" text-anchor="start" dominant-baseline="central">6종 운용 방식 비교</text>
  <text x="580" y="744" font-size="15" font-weight="600" fill="#503606" data-fill-role="amber-ink" text-anchor="start" dominant-baseline="central">통합 가구 원장 구축</text>
  <path d="M742.0 701.0 L750.0 709.0 L742.0 717.0" fill="none" stroke="#B08434" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="amber-line"/>
  <rect x="756" y="628" width="170" height="162" rx="12" fill="#FBF3E3" data-fill-role="amber-fill" stroke="#B08434" stroke-width="1.2" data-stroke-role="edge-line"/>
  <text x="770" y="654" font-size="16.5" font-weight="700" fill="#503606" data-fill-role="amber-ink" text-anchor="start" dominant-baseline="central">③ 무결성 검증</text>
  <text x="770" y="692" font-size="15" font-weight="600" fill="#503606" data-fill-role="amber-ink" text-anchor="start" dominant-baseline="central">3예산 × 4소득 경로</text>
  <text x="770" y="718" font-size="15" font-weight="600" fill="#503606" data-fill-role="amber-ink" text-anchor="start" dominant-baseline="central">72개 조합 전수 검증</text>
  <text x="770" y="744" font-size="15" font-weight="600" fill="#503606" data-fill-role="amber-ink" text-anchor="start" dominant-baseline="central">재현 4초 만에 완료</text>
  <rect x="950" y="628" width="178" height="70" rx="12" fill="#FBF3E3" data-fill-role="amber-fill" stroke="#B08434" stroke-width="1.2" data-stroke-role="edge-line"/>
  <text x="1039.0" y="652" font-size="27" font-weight="700" fill="#503606" data-fill-role="amber-ink" text-anchor="middle" dominant-baseline="central">1.000 (1위)</text>
  <text x="1039.0" y="682" font-size="14.5" font-weight="600" fill="#503606" data-fill-role="amber-ink" text-anchor="middle" dominant-baseline="central">계속 보유 전원 최우수</text>
  <rect x="950" y="710" width="178" height="70" rx="12" fill="#FBF3E3" data-fill-role="amber-fill" stroke="#B08434" stroke-width="1.2" data-stroke-role="edge-line"/>
  <text x="1039.0" y="734" font-size="27" font-weight="700" fill="#503606" data-fill-role="amber-ink" text-anchor="middle" dominant-baseline="central">0.990</text>
  <text x="1039.0" y="764" font-size="14.5" font-weight="600" fill="#503606" data-fill-role="amber-ink" text-anchor="middle" dominant-baseline="central">3년 만기 이전 최고치</text>
</svg>