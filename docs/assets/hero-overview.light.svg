  <text x="986" y="492" font-size="14" font-weight="600" fill="#28244F" data-fill-role="purple-ink" text-anchor="start" dominant-baseline="central">SHA-256 불변봉인</text>
  <text x="986" y="511" font-size="14" font-weight="600" fill="#28244F" data-fill-role="purple-ink" text-anchor="start" dominant-baseline="central">Drive 원격 백업</text>
</svg>