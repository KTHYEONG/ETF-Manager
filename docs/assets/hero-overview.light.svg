<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" role="img" style="font-family:Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
  <title>ETF-Manager 3대 계좌 최종 자산배분 연구 결과와 생명주기</title>
  <desc>일반계좌 QQQ 90% + SOXX 10%, 연금저축 나스닥100 90% + 배당 10%, ISA 계속 보유 확정과 6단계 결정 생명주기</desc>
  <defs><filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.07" data-paint-static="true"/></filter></defs>
  <rect width="1200" height="590" fill="#F7F7F5" data-fill-role="canvas"/>
  <rect x="48" y="44" width="6" height="64" rx="3" fill="#2E6DA4" data-fill-role="focus"/>
  <text x="70" y="50" font-size="13.5" font-weight="700" fill="#2F3846" data-fill-role="ink" text-anchor="start" dominant-baseline="central" letter-spacing="0.08em">RESEARCH FINDINGS &amp; ASSET ALLOCATION</text>
  <text x="70" y="78" font-size="28" font-weight="700" fill="#1B212B" data-fill-role="ink" text-anchor="start" dominant-baseline="central">3대 계좌 최종 자산배분 연구 결과 &amp; 확정 포트폴리오</text>
  <text x="70" y="108" font-size="15" font-weight="600" fill="#2F3846" data-fill-role="ink" text-anchor="start" dominant-baseline="central">시점 정합성(PIT) 데이터와 법령 원문 세후 원장으로 수십 년 역사적 구간을 전수 검증·동결한 포트폴리오</text>
  <rect x="48" y="136" width="352" height="224" rx="16" fill="#FFFFFF" data-fill-role="surface" stroke="#2E6DA4" stroke-width="1.5" data-stroke-role="edge-line" filter="url(#shadow)"/>
  <rect x="66" y="152" width="138" height="26" rx="13" fill="#EAF0F6" stroke="#2E6DA4" stroke-width="1" data-fill-role="blue-fill" data-stroke-role="blue-line"/>
  <text x="135.0" y="165.0" font-size="12" font-weight="700" fill="#12324E" data-fill-role="blue-ink" text-anchor="middle" dominant-baseline="central" letter-spacing="0.03em">일반계좌 · 해외직투</text>
  <circle cx="360" cy="165" r="20" fill="#EAF0F6" data-fill-role="icon-tint"/>
  <g transform="translate(345,150) scale(1.25)"><path d="M4 19h16 M6 15l4-5 4 3 6-7" fill="none" stroke="#2E6DA4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="blue-line"/></g>
  <text x="66" y="202" font-size="22" font-weight="700" fill="#12324E" data-fill-role="blue-ink" dominant-baseline="central">QQQ 90% + SOXX 10%</text>
  <text x="66" y="250" font-size="44" font-weight="700" fill="#1B212B" data-fill-role="ink" dominant-baseline="central">24.7<tspan font-size="22" dx="3">%</tspan></text>
  <text x="210" y="252" font-size="14.5" font-weight="700" fill="#12324E" data-fill-role="blue-ink" dominant-baseline="central">실질 연수익률 (세후)</text>
  <text x="66" y="295" font-size="14" font-weight="600" fill="#1B212B" data-fill-role="ink" text-anchor="start" dominant-baseline="central">· 기준(QQQ 100% 23.3%) 대비 전 코호트 우세</text>
  <text x="66" y="318" font-size="14" font-weight="600" fill="#1B212B" data-fill-role="ink" text-anchor="start" dominant-baseline="central">· 최악 기간 1.022배 · 연 250만 원 공제 TGH</text>
  <text x="66" y="341" font-size="13" font-weight="600" fill="#636A75" data-fill-role="sub-ink" text-anchor="start" dominant-baseline="central">※ SOXX 15% 초과는 변동성 쏠림으로 기각</text>
  <rect x="424" y="136" width="352" height="224" rx="16" fill="#FFFFFF" data-fill-role="surface" stroke="#3F8F72" stroke-width="1.5" data-stroke-role="edge-line" filter="url(#shadow)"/>
  <rect x="442" y="152" width="138" height="26" rx="13" fill="#ECF4F1" stroke="#3F8F72" stroke-width="1" data-fill-role="green-fill" data-stroke-role="green-line"/>
  <text x="511.0" y="165.0" font-size="12" font-weight="700" fill="#17402F" data-fill-role="green-ink" text-anchor="middle" dominant-baseline="central" letter-spacing="0.03em">연금저축 · 국내ETF</text>
  <circle cx="736" cy="165" r="20" fill="#ECF4F1" data-fill-role="icon-tint"/>
  <g transform="translate(721,150) scale(1.25)"><path d="M12 3s8 3 8 9c0 5-5 8-8 9-3-1-8-4-8-9 0-6 8-9 8-9z" fill="none" stroke="#3F8F72" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="green-line"/></g>
  <text x="442" y="202" font-size="22" font-weight="700" fill="#17402F" data-fill-role="green-ink" dominant-baseline="central">나스닥100 90% + 배당 10%</text>
  <text x="442" y="250" font-size="44" font-weight="700" fill="#1B212B" data-fill-role="ink" dominant-baseline="central">1.024<tspan font-size="22" dx="3">배</tspan></text>
  <text x="608" y="252" font-size="14.5" font-weight="700" fill="#17402F" data-fill-role="green-ink" dominant-baseline="central">3대 구간 최저 우위</text>
  <text x="442" y="295" font-size="14" font-weight="600" fill="#1B212B" data-fill-role="ink" text-anchor="start" dominant-baseline="central">· 100년(1.039) · 현대(1.057) · 실제ETF(1.024)</text>
  <text x="442" y="318" font-size="14" font-weight="600" fill="#1B212B" data-fill-role="ink" text-anchor="start" dominant-baseline="central">· 3개 증거 구간 모두 0.995 지배 가드 통과</text>
  <text x="442" y="341" font-size="13" font-weight="600" fill="#636A75" data-fill-role="sub-ink" text-anchor="start" dominant-baseline="central">※ 배당 20% 대안은 실제 구간 미달(0.992) 기각</text>
  <rect x="800" y="136" width="352" height="224" rx="16" fill="#FFFFFF" data-fill-role="surface" stroke="#5B54A8" stroke-width="1.5" data-stroke-role="edge-line" filter="url(#shadow)"/>
  <rect x="818" y="152" width="138" height="26" rx="13" fill="#EFEEF6" stroke="#5B54A8" stroke-width="1" data-fill-role="purple-fill" data-stroke-role="purple-line"/>
  <text x="887.0" y="165.0" font-size="12" font-weight="700" fill="#28244F" data-fill-role="purple-ink" text-anchor="middle" dominant-baseline="central" letter-spacing="0.03em">ISA 중개형 · 비과세</text>
  <circle cx="1112" cy="165" r="20" fill="#EFEEF6" data-fill-role="icon-tint"/>
  <g transform="translate(1097,150) scale(1.25)"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M8 12l3 3 5-6" fill="none" stroke="#5B54A8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="purple-line"/></g>
  <text x="818" y="202" font-size="22" font-weight="700" fill="#28244F" data-fill-role="purple-ink" dominant-baseline="central">계속 보유 (HOLD)</text>
  <text x="818" y="250" font-size="44" font-weight="700" fill="#1B212B" data-fill-role="ink" dominant-baseline="central">1위 <tspan font-size="22" dx="3">(1.000)</tspan></text>
  <text x="996" y="252" font-size="14.5" font-weight="700" fill="#28244F" data-fill-role="purple-ink" dominant-baseline="central">전 예산 최우수</text>
  <text x="818" y="295" font-size="14" font-weight="600" fill="#1B212B" data-fill-role="ink" text-anchor="start" dominant-baseline="central">· 연 600만 · 1,200만 · 2,000만 세 예산 전승</text>
  <text x="818" y="318" font-size="14" font-weight="600" fill="#1B212B" data-fill-role="ink" text-anchor="start" dominant-baseline="central">· 연금저축 포트폴리오를 승계해 복리 극대화</text>
  <text x="818" y="341" font-size="13" font-weight="600" fill="#636A75" data-fill-role="sub-ink" text-anchor="start" dominant-baseline="central">※ 3년 만기 연금 이전(0.970~0.990) 전원 기각</text>
  <rect x="48" y="380" width="1104" height="176" rx="16" fill="#F1F2F3" data-fill-role="surface-tint" stroke="#636A75" stroke-width="1.2" data-stroke-role="edge-line"/>
  <text x="72" y="406" font-size="17" font-weight="700" fill="#1B212B" data-fill-role="ink" text-anchor="start" dominant-baseline="central">신뢰 가능한 6단계 연구 &amp; 자산배분 생명주기 (SHA-256 결속 동결)</text>
  <rect x="72" y="426" width="156" height="108" rx="12" fill="#EAF0F6" data-fill-role="blue-fill" stroke="#2E6DA4" stroke-width="1.3" data-stroke-role="edge-line"/>
  <text x="86" y="446" font-size="16" font-weight="700" fill="#12324E" data-fill-role="blue-ink" text-anchor="start" dominant-baseline="central">STEP 01</text>
  <text x="86" y="470" font-size="15" font-weight="700" fill="#12324E" data-fill-role="blue-ink" text-anchor="start" dominant-baseline="central">원천 수집</text>
  <text x="86" y="492" font-size="14" font-weight="600" fill="#12324E" data-fill-role="blue-ink" text-anchor="start" dominant-baseline="central">5대 데이터 수집</text>
  <text x="86" y="511" font-size="14" font-weight="600" fill="#12324E" data-fill-role="blue-ink" text-anchor="start" dominant-baseline="central">공시 시각 태깅</text>
