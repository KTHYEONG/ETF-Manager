  <rect x="252" y="426" width="156" height="108" rx="12" fill="#EAF0F6" data-fill-role="blue-fill" stroke="#2E6DA4" stroke-width="1.3" data-stroke-role="edge-line"/>
  <text x="266" y="446" font-size="16" font-weight="700" fill="#12324E" data-fill-role="blue-ink" text-anchor="start" dominant-baseline="central">STEP 02</text>
  <text x="266" y="470" font-size="15" font-weight="700" fill="#12324E" data-fill-role="blue-ink" text-anchor="start" dominant-baseline="central">불변 레이크</text>
  <text x="266" y="492" font-size="14" font-weight="600" fill="#12324E" data-fill-role="blue-ink" text-anchor="start" dominant-baseline="central">10대 품질 검증</text>
  <text x="266" y="511" font-size="14" font-weight="600" fill="#12324E" data-fill-role="blue-ink" text-anchor="start" dominant-baseline="central">SHA-256 저장</text>
  <path d="M415.5 471.0 L424.5 480.0 L415.5 489.0" fill="none" stroke="#636A75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="gray-line"/>
  <rect x="432" y="426" width="156" height="108" rx="12" fill="#ECF4F1" data-fill-role="green-fill" stroke="#3F8F72" stroke-width="1.3" data-stroke-role="edge-line"/>
  <text x="446" y="446" font-size="16" font-weight="700" fill="#17402F" data-fill-role="green-ink" text-anchor="start" dominant-baseline="central">STEP 03</text>
  <text x="446" y="470" font-size="15" font-weight="700" fill="#17402F" data-fill-role="green-ink" text-anchor="start" dominant-baseline="central">매수전용 배분</text>
  <text x="446" y="492" font-size="14" font-weight="600" fill="#17402F" data-fill-role="green-ink" text-anchor="start" dominant-baseline="central">다음 날 정수 체결</text>
  <text x="446" y="511" font-size="14" font-weight="600" fill="#17402F" data-fill-role="green-ink" text-anchor="start" dominant-baseline="central">동일 납입금 고정</text>
  <path d="M595.5 471.0 L604.5 480.0 L595.5 489.0" fill="none" stroke="#636A75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="gray-line"/>
  <rect x="612" y="426" width="156" height="108" rx="12" fill="#ECF4F1" data-fill-role="green-fill" stroke="#3F8F72" stroke-width="1.3" data-stroke-role="edge-line"/>
  <text x="626" y="446" font-size="16" font-weight="700" fill="#17402F" data-fill-role="green-ink" text-anchor="start" dominant-baseline="central">STEP 04</text>
  <text x="626" y="470" font-size="15" font-weight="700" fill="#17402F" data-fill-role="green-ink" text-anchor="start" dominant-baseline="central">3계좌 세후원장</text>
  <text x="626" y="492" font-size="14" font-weight="600" fill="#17402F" data-fill-role="green-ink" text-anchor="start" dominant-baseline="central">세법 원문 조문</text>
  <text x="626" y="511" font-size="14" font-weight="600" fill="#17402F" data-fill-role="green-ink" text-anchor="start" dominant-baseline="central">원단위 절사 계산</text>
  <path d="M775.5 471.0 L784.5 480.0 L775.5 489.0" fill="none" stroke="#636A75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="gray-line"/>
  <rect x="792" y="426" width="156" height="108" rx="12" fill="#FBF3E3" data-fill-role="amber-fill" stroke="#B08434" stroke-width="1.3" data-stroke-role="edge-line"/>
  <text x="806" y="446" font-size="16" font-weight="700" fill="#503606" data-fill-role="amber-ink" text-anchor="start" dominant-baseline="central">STEP 05</text>
  <text x="806" y="470" font-size="15" font-weight="700" fill="#503606" data-fill-role="amber-ink" text-anchor="start" dominant-baseline="central">다중구간 검증</text>
  <text x="806" y="492" font-size="14" font-weight="600" fill="#503606" data-fill-role="amber-ink" text-anchor="start" dominant-baseline="central">최악 구간 채택</text>
  <text x="806" y="511" font-size="14" font-weight="600" fill="#503606" data-fill-role="amber-ink" text-anchor="start" dominant-baseline="central">0.995 지배가드</text>
  <path d="M955.5 471.0 L964.5 480.0 L955.5 489.0" fill="none" stroke="#636A75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="gray-line"/>
  <rect x="972" y="426" width="156" height="108" rx="12" fill="#EFEEF6" data-fill-role="purple-fill" stroke="#5B54A8" stroke-width="1.3" data-stroke-role="edge-line"/>
  <text x="986" y="446" font-size="16" font-weight="700" fill="#28244F" data-fill-role="purple-ink" text-anchor="start" dominant-baseline="central">STEP 06</text>
